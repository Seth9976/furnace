name: Build furnace  
  
on:  
  push:  
    branches: [ master, main ]  
  pull_request:  
    branches: [ master, main ]  
  workflow_dispatch:  
defaults:  
  run:  
    shell: bash  
  
env:  
  BUILD_TYPE: Debug  
  
permissions:  
  contents: write  
  
jobs:  
  build:  
    strategy:  
      matrix:  
        config:  
          - { name: 'Windows MSVC x86', os: windows-latest, compiler: msvc, arch: x86 }  
          - { name: 'Windows MSVC x86_64', os: windows-latest, compiler: msvc, arch: x86_64 }  
          - { name: 'Windows MinGW x86_64', os: ubuntu-latest, compiler: mingw, arch: x86_64 }  
          - { name: 'macOS x86_64', os: macos-14, arch: x86_64 }  
          - { name: 'macOS ARM', os: macos-latest, arch: arm64 }  
          - { name: 'Linux x86_64', os: ubuntu-22.04, arch: x86_64 }  
        variant: [ gui, console ]  
      fail-fast: true  
  
    name: ${{ matrix.config.name }} (${{ matrix.variant }})  
    runs-on: ${{ matrix.config.os }}  
  
    steps:  
    - name: Checkout  
      uses: actions/checkout@v4  
      with:  
        submodules: recursive  
  
    - name: Set Windows arch identifiers  
      id: windows-identify  
      if: ${{ matrix.config.compiler == 'msvc' || matrix.config.compiler == 'mingw' }}  
      run: |  
        vswhere_target="${{ matrix.config.arch }}"  
        msvc_target="${{ matrix.config.arch }}"  
        mingw_target="${{ matrix.config.arch }}"  
  
        if [ '${{ matrix.config.arch }}' == 'x86' ]; then  
          msvc_target="Win32"  
        elif [ '${{ matrix.config.arch }}' == 'x86_64' ]; then  
          vswhere_target="amd64"  
          msvc_target="x64"  
        fi  
  
        echo "vswhere-target=${vswhere_target}" >> $GITHUB_OUTPUT  
        echo "msvc-target=${msvc_target}" >> $GITHUB_OUTPUT  
        echo "mingw-target=${mingw_target}" >> $GITHUB_OUTPUT  
  
    - name: Set variant identifier  
      id: variant-identify  
      run: |  
        variant_tag="GUI"  
        if [ '${{ matrix.variant }}' == 'console' ]; then  
          variant_tag="CLI"  
        fi  
        echo "tag=${variant_tag}" >> $GITHUB_OUTPUT  
  
    - name: Set package identifier  
      id: package-identify  
      run: |  
        package_name="furnace-${GITHUB_SHA}"  
        package_ext=""  
        if [ '${{ runner.os }}' == 'Windows' ] || [ '${{ matrix.config.compiler }}' == 'mingw' ]; then  
          package_name="${package_name}-Windows"  
          if [ '${{ matrix.config.compiler }}' == 'mingw' ]; then  
            package_name="${package_name}-MinGW"  
          else  
            package_name="${package_name}-MSVC"  
          fi  
          package_name="${package_name}-${{ matrix.config.arch }}"  
        elif [ '${{ runner.os }}' == 'macOS' ]; then  
          package_name="${package_name}-macOS-${{ matrix.config.arch }}"  
        else  
          package_name="${package_name}-Linux-${{ matrix.config.arch }}"  
        fi  
  
        package_name="${package_name}-${{ steps.variant-identify.outputs.tag }}"  
  
        package_ext=".tar.gz"  
        if [ '${{ runner.os }}' == 'Windows' ] || [ '${{ matrix.config.compiler }}' == 'mingw' ]; then  
          package_ext=".zip"  
        elif [ '${{ runner.os }}' == 'macOS' ] && [ '${{ matrix.variant }}' == 'gui' ]; then  
          package_ext=".dmg"  
        fi  
  
        echo "Package identifier: ${package_name}"  
        echo "Package file: ${package_name}${package_ext}"  
  
        echo "id=${package_name}" >> $GITHUB_OUTPUT  
        echo "filename=${package_name}${package_ext}" >> $GITHUB_OUTPUT  
  
    - name: Set build cores amount  
      id: build-cores  
      run: |  
        amount=2  
        if [ '${{ runner.os }}' == 'macOS' ]; then  
          amount=3  
        fi  
        echo "amount=${amount}" >> $GITHUB_OUTPUT  
  
    - name: Setup Toolchain [Windows MSVC]  
      if: ${{ matrix.config.compiler == 'msvc' }}  
      uses: lunathir/gha-setup-vsdevenv@avoid-deprecation-warnings  
      with:  
        arch: ${{ steps.windows-identify.outputs.vswhere-target }}  
  
    - name: Setup Toolchain [Windows MinGW]  
      if: ${{ matrix.config.compiler == 'mingw' }}  
      run: |  
        sudo apt update  
        sudo apt install -y mingw-w64 mingw-w64-tools  
  
    - name: Install Dependencies [Linux x86_64]  
      if: ${{ runner.os == 'Linux' && matrix.config.compiler != 'mingw' && matrix.config.arch == 'x86_64' }}  
      run: |  
        sudo apt update  
        sudo apt install -y libsdl2-dev libfmt-dev librtmidi-dev libsndfile1-dev zlib1g-dev libjack-jackd2-dev gettext  
  
    - name: Build Language Files  
      if: ${{ runner.os == 'Linux' && matrix.config.compiler != 'mingw' }}  
      run: |  
        ./scripts/build-po.sh  
  
    - name: Configure  
      run: |  
        export USE_WAE=OFF  
        export BUILD_GUI_FLAG=ON  
        export CONSOLE_SUBSYSTEM_FLAG=OFF  
        export CMAKE_EXTRA_ARGS=()  
  
        if [ '${{ matrix.variant }}' == 'console' ]; then  
          BUILD_GUI_FLAG=OFF  
          if [ '${{ runner.os }}' == 'Windows' ] || [ '${{ matrix.config.compiler }}' == 'mingw' ]; then  
            CONSOLE_SUBSYSTEM_FLAG=ON  
          fi  
        fi  
  
        if [ '${{ matrix.config.compiler }}' == 'msvc' ]; then  
          CMAKE_EXTRA_ARGS+=('-DCMAKE_GENERATOR_PLATFORM=${{ steps.windows-identify.outputs.msvc-target }}')  
          CMAKE_EXTRA_ARGS+=('-DCMAKE_POLICY_DEFAULT_CMP0091=NEW')  
          if [ '${{ env.BUILD_TYPE }}' == 'Debug' ]; then  
            CMAKE_EXTRA_ARGS+=('-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDebug')  
          else  
            CMAKE_EXTRA_ARGS+=('-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded')  
          fi  
        elif [ '${{ matrix.config.compiler }}' == 'mingw' ]; then  
          CMAKE_EXTRA_ARGS+=('-DCMAKE_TOOLCHAIN_FILE=scripts/Cross-MinGW-${{ steps.windows-identify.outputs.mingw-target }}.cmake' '-DCMAKE_C_FLAGS="-Wno-deprecated-declarations"' '-DCMAKE_CXX_FLAGS="-Wno-deprecated-declarations"')  
        elif [ '${{ runner.os }}' == 'macOS' ]; then  
          CMAKE_EXTRA_ARGS+=('-DCMAKE_C_FLAGS="-O2"' '-DCMAKE_CXX_FLAGS="-O2"')  
          if [ '${{ matrix.config.arch }}' == 'arm64' ]; then  
            CMAKE_EXTRA_ARGS+=('-DCMAKE_OSX_DEPLOYMENT_TARGET="11.0"' '-DCMAKE_OSX_ARCHITECTURES=arm64')  
          else  
            CMAKE_EXTRA_ARGS+=('-DCMAKE_OSX_DEPLOYMENT_TARGET="10.9"' '-DCMAKE_OSX_ARCHITECTURES=x86_64' '-DCMAKE_C_FLAGS=-march=core2' '-DCMAKE_CXX_FLAGS=-march=core2')  
          fi  
          if [ '${{ matrix.variant }}' == 'gui' ]; then  
            CMAKE_EXTRA_ARGS+=('-DMAKE_BUNDLE=ON')  
          else  
            CMAKE_EXTRA_ARGS+=('-DMAKE_BUNDLE=OFF')  
          fi  
        fi  
  
        CMAKE_EXTRA_ARGS+=("-DBUILD_GUI=${BUILD_GUI_FLAG}")  
        CMAKE_EXTRA_ARGS+=("-DCONSOLE_SUBSYSTEM=${CONSOLE_SUBSYSTEM_FLAG}")  
  
        cmake -B ${PWD}/build -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DWARNINGS_ARE_ERRORS=${USE_WAE} -DWITH_DEMOS=OFF -DWITH_INSTRUMENTS=OFF -DWITH_WAVETABLES=OFF "${CMAKE_EXTRA_ARGS[@]}"  
  
    - name: Build  
      run: |  
        cmake --build ${PWD}/build --config ${{ env.BUILD_TYPE }} --parallel ${{ steps.build-cores.outputs.amount }}  
  
    - name: Package [Windows]  
      if: ${{ runner.os == 'Windows' || matrix.config.compiler == 'mingw' }}  
      run: |  
        found_binary=$(find build -iname "furnace.exe" -type f -print -quit)  
        echo "Successfully located binary at: $found_binary"  
  
        mkdir ${{ steps.package-identify.outputs.id }}  
        pushd ${{ steps.package-identify.outputs.id }}  
  
        cp -v ../LICENSE.GPLv3 LICENSE.txt  
        cp -v ../$found_binary ./furnace.exe  
  
        pdb_file=$(dirname "../$found_binary")/furnace.pdb  
        if [ -e "$pdb_file" ]; then  
          cp -v "$pdb_file" ./  
        fi  
  
        if [ '${{ matrix.variant }}' == 'gui' ]; then  
          cp -v ../res/releaseReadme/unstable-win.txt README.txt  
          cp -vr ../po/locale locale  
          cp -vr ../papers ./  
        else  
          echo "console build - furnace -console <file>" > README.txt  
        fi  
  
        sha256sum furnace.exe > checksum.txt  
        popd  
  
        pushd ${{ steps.package-identify.outputs.id }}  
        zip -r ../${{ steps.package-identify.outputs.filename }} .  
        popd  
  
    - name: Package [macOS]  
      if: ${{ runner.os == 'macOS' && matrix.variant == 'gui' }}  
      run: |  
        pushd build  
        found_app=$(find . -iname "Furnace.app" -print -quit)  
        echo "Successfully located app bundle at: $found_app"  
  
        echo "preparing bundle"  
        mkdir -p Furnace.app/Contents/Resources  
        cp -v -r ../po/locale Furnace.app/Contents/Resources/locale  
        cp -v ../res/icon.icns Furnace.app/Contents/Resources/Furnace.icns  
  
        codesign --deep -f -s - Furnace.app  
  
        echo "making dirs"  
        mkdir new  
  
        echo "copying"  
        cp -v -r Furnace.app new/Furnace.app  
        ln -s /Applications new/Applications  
        sync  
  
        echo "copying extra stuff"  
        cp -v ../LICENSE.GPLv2 new/LICENSE.txt  
        cp -v ../res/releaseReadme/stable-mac.txt new/README  
        cp -v -r ../demos new/demos  
        cp -v -r ../instruments new/instruments  
        cp -v -r ../wavetables new/wavetables  
        cd new  
        wget https://tildearrow.org/furnace/doc/latest/manual.pdf  
        cd ..  
  
        hdiutil create -srcfolder new -volname Furnace -format UDZO -fs HFS+ furnace.dmg  
        mv furnace.dmg ../${{ steps.package-identify.outputs.filename }}  
        popd  
  
    - name: Package [macOS Console]  
      if: ${{ runner.os == 'macOS' && matrix.variant == 'console' }}  
      run: |  
        found_binary=$(find build -iname "furnace" -type f -perm +111 -print -quit)  
        echo "Successfully located binary at: $found_binary"  
  
        mkdir ${{ steps.package-identify.outputs.id }}  
        pushd ${{ steps.package-identify.outputs.id }}  
  
        cp -v ../$found_binary ./furnace  
        cp -v ../LICENSE.GPLv2 LICENSE.txt  
        echo "console build - ./furnace -console <file>" > README.txt  
  
        shasum -a 256 furnace > checksum.txt  
        popd  
  
        tar -zcv -f ${{ steps.package-identify.outputs.filename }} ${{ steps.package-identify.outputs.id }}  
  
    - name: Package [Linux]  
      if: ${{ runner.os == 'Linux' && matrix.config.compiler != 'mingw' }}  
      run: |  
        mkdir -p target/furnace  
        make -C ${PWD}/build DESTDIR=${PWD}/target/furnace install  
        pushd target/furnace  
  
        cp -v ../../res/logo.png .DirIcon  
  
        cd usr  
        found_bin=$(find . -iname "furnace" -type f -print -quit)  
        echo "Successfully located linux binary at: $found_bin"  
  
        mv $(dirname "$found_bin")/furnace ..  
        rm -rf bin || true  
  
        rm -rf share/applications share/doc share/icons share/licenses share/metainfo share/mime  
        mv share/locale ..  
        rmdir share || true  
  
        cd ..  
  
        cp ../../LICENSE.GPLv2 .  
  
        if [ '${{ matrix.variant }}' == 'gui' ]; then  
          cp ../../res/releaseReadme/unstable-other.txt .  
          cp -r ../../papers papers  
        else  
          echo "console build - ./furnace -console <file>" > unstable-other.txt  
        fi  
  
        rmdir usr || true  
  
        popd  
  
        cd target  
        tar -zcv -f ../${{ steps.package-identify.outputs.filename }} furnace  
  
    - name: Upload artifact  
      uses: actions/upload-artifact@v4  
      with:  
        name: ${{ steps.package-identify.outputs.id }}  
        path: ${{ steps.package-identify.outputs.filename }}  
  
  release:  
    name: Publish Release  
    needs: build  
    if: ${{ github.event_name != 'pull_request' }}  
    runs-on: ubuntu-latest  
    permissions:  
      contents: write  
    steps:  
    - name: Download all artifacts  
      uses: actions/download-artifact@v4  
      with:  
        path: artifacts  
        merge-multiple: true  
  
    - name: List downloaded artifacts  
      run: |  
        find artifacts -type f -print  
  
    - name: Publish to Release page  
      uses: softprops/action-gh-release@v2  
      with:  
        tag_name: nightly-${{ github.run_number }}  
        name: Nightly build ${{ github.run_number }} (${{ github.sha }})  
        prerelease: true  
        make_latest: false  
        files: artifacts/*
